
name: CNN Turk automatisch aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Streamlink installieren
        run: python -m pip install --upgrade streamlink

      - name: Stream pruefen und an Cloudflare senden
        env:
          WORKER_URL: https://youtube-iptv-live.54xsai54.workers.dev
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          import urllib.error
          from urllib.parse import urlsplit, urljoin

          source = 'https://www.cnnturk.com/canli-yayin'

          print('CNN Turk: Offiziellen Stream ermitteln')

          url = subprocess.check_output(
              [
                  'streamlink',
                  '--loglevel', 'error',
                  '--stream-url',
                  source,
                  'best'
              ],
              text=True,
              timeout=60
          ).strip()

          
          # Originalen CNN-Tuerk-Pfad mit // erhalten
          if url.startswith('https://live.duhnet.tv/S2/HLS_LIVE/'):
              url = url.replace(
                  'https://live.duhnet.tv/S2/HLS_LIVE/',
                  'https://live.duhnet.tv//S2/HLS_LIVE/',
                  1
              )

          print('CNN Turk: Original-Pfad mit // gesetzt')
          
          p = urlsplit(url)

          if p.scheme != 'https' or not p.path.lower().endswith('.m3u8'):
              raise RuntimeError('Keine gueltige HLS-Adresse gefunden')

          print('Stream-Adresse gefunden: JA')
          print('Stream-Host:', p.hostname)

          def read_m3u(address):
              request = urllib.request.Request(
                  address,
                  headers={
                      'User-Agent': 'VLC/3.0.20 LibVLC/3.0.20'
                  }
              )

              with urllib.request.urlopen(request, timeout=20) as r:
                  data = r.read(300000).decode(
                      'utf-8-sig', 'replace'
                  )

              if not data.lstrip().startswith('#EXTM3U'):
                  raise RuntimeError('Keine gueltige HLS-Playlist')

              return data

          print('Pruefe HLS-Playlist')

          manifest = read_m3u(url)

          if '#EXT-X-STREAM-INF' in manifest:
              lines = [
                  x.strip()
                  for x in manifest.splitlines()
                  if x.strip()
              ]

              variants = [
                  lines[i + 1]
                  for i, x in enumerate(lines[:-1])
                  if x.startswith('#EXT-X-STREAM-INF')
                  and not lines[i + 1].startswith('#')
              ]

              if not variants:
                  raise RuntimeError('HLS-Variante fehlt')

              read_m3u(urljoin(url, variants[-1]))

          print('HLS-Playlist: ERREICHBAR')

          token = os.environ.get('SYNC_TOKEN', '')

          if not token:
              raise RuntimeError('SYNC_TOKEN fehlt')

          payload = {
              'results': [
                  {
                      'slug': 'cnn-turk',
                      'url': url,
                      'status': 'HLS gefunden',
                      'message': 'CNN Turk offiziell: HLS erreichbar'
                  }
              ]
          }

          req = urllib.request.Request(
              os.environ['WORKER_URL'].rstrip('/') + '/api/sync',
              data=json.dumps(payload).encode('utf-8'),
              method='POST',
          headers={
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token,
          'User-Agent': 'CNNturk-IPTV-Sync/1.0'
            }
          )

          print('Uebertrage Stream an Cloudflare')

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.load(response)

          except urllib.error.HTTPError as error:
              print('Cloudflare HTTP-Fehler:', error.code)
              print(
                  'Cloudflare Antwort:',
                  error.read(300).decode('utf-8', 'replace')
              )
              raise

          except urllib.error.URLError as error:
              print('Cloudflare Verbindungsfehler:', error.reason)
              raise

          if not result.get('ok'):
              print('Cloudflare Antwort:', str(result)[:300])
              raise RuntimeError('Cloudflare-Update fehlgeschlagen')

          print('Cloudflare aktualisiert: JA')
          print('CNN Turk Synchronisierung abgeschlossen')
          print('IPTV-Wiedergabe muss noch getestet werden')

          PY
